[project]
name = "maersk-kiro-demo"
version = "0.1.0"
description = "Audio Transcription to Kiro Spec Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.28.0",
    "boto3>=1.34.0",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Enables the Parakeet MLX local transcription engine (Apple Silicon only).
# Install with: `uv sync --extra local-transcribe`
# or: `pip install -e ".[local-transcribe]"`.
# Requires `ffmpeg` on PATH for audio preprocessing.
local-transcribe = [
    "parakeet-mlx @ git+https://github.com/senstella/parakeet-mlx.git@master",
]
